name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S error skills/audit-code/scripts/*.sh tests/smoke.sh
      - name: frontmatter and references
        run: python3 tests/validate-skill.py
      - name: smoke test (fixture, both modes)
        run: tests/smoke.sh
